<nav class="pagination-bar" aria-label="Results pages"><span>{{ pagination.total }} records · Page {{ pagination.page }} of {{ pagination.pages or 1 }}</span><div>{% if pagination.has_prev %}<a class="btn btn-outline-primary btn-sm" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.prev_num)) }}">Previous</a>{% endif %}{% if pagination.has_next %}<a class="btn btn-outline-primary btn-sm" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.next_num)) }}">Next</a>{% endif %}</div></nav>
