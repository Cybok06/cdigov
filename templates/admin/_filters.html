<form class="filter-bar" method="get"><div class="search-field"><i class="bi bi-search"></i><input name="q" aria-label="Search by name word or reference" value="{{ request.args.get('q','') }}" placeholder="Search name or reference…" class="form-control"></div><select name="status" aria-label="Registration status" class="form-select"><option value="">All statuses</option>{% for value,label in [('in_progress','In progress'),('location_saved','Location saved · draft'),('submitted','Submitted')] %}<option value="{{ value }}" {{ 'selected' if request.args.get('status') == value else '' }}>{{ label }}</option>{% endfor %}</select><input type="date" name="start" aria-label="Started from" value="{{ request.args.get('start','') }}" class="form-control"><input type="date" name="end" aria-label="Started through" value="{{ request.args.get('end','') }}" class="form-control"><button class="btn btn-outline-primary">Apply filters</button><a href="{{ request.path }}" class="small">Reset</a></form>
